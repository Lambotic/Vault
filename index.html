<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2340;--navy3:#2d3a5c;--gold:#c9a84c;--text:#f0f0f0;--text2:#a0a8bb;--text3:#6b7490;--card:#1e2744;--card2:#252f50;--danger:#e24b4a;--success:#1a9e75;--r:27px;--r2:18px}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--navy);color:var(--text);width:1080px;transform-origin:top left;position:absolute;top:0;left:0}

#pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px 54px;gap:0}
.vault-icon{width:162px;height:162px;border-radius:50%;background:var(--card2);border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.app-title{font-size:81px;color:var(--gold);letter-spacing:12px;margin-bottom:18px;font-weight:600}
.app-sub{font-size:45px;color:var(--text2);margin-bottom:14px;text-align:center;line-height:1.4}
.pin-phase{font-size:39px;color:var(--gold);margin-bottom:32px;text-align:center;min-height:45px}
.pin-dots{display:flex;gap:36px;margin-bottom:40px}
.pin-dot{width:45px;height:45px;border-radius:50%;border:4px solid var(--text3)}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%}
.key{height:162px;border-radius:var(--r2);border:3px solid var(--navy3);background:var(--card2);color:var(--text);font-size:68px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;font-family:inherit}
.key:active{background:var(--navy3)}
.key.gold{color:var(--gold)}
.pin-msg{font-size:40px;color:var(--danger);margin-top:22px;min-height:50px;text-align:center}

#main-app{display:none;flex-direction:column;overflow:hidden}
.topbar{background:var(--card);border-bottom:3px solid var(--navy3);padding:32px 40px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:58px;color:var(--gold);letter-spacing:6px;font-weight:600}
.topbar-right{display:flex;gap:18px;align-items:center}
.icon-btn{width:108px;height:108px;border-radius:var(--r2);border:3px solid var(--navy3);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;font-size:54px}
.icon-btn:active{background:var(--card2)}
.sync-status{font-size:36px;color:var(--text3);margin-right:9px}
.sync-status.ok{color:var(--success)}
.sync-status.err{color:var(--danger)}
.search-bar{padding:27px 40px;background:var(--card);border-bottom:3px solid var(--navy3);flex-shrink:0}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--navy);border:3px solid var(--navy3);border-radius:var(--r2);padding:27px 27px 27px 94px;color:var(--text);font-size:45px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.si{position:absolute;left:27px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:45px;pointer-events:none}
.folder-tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:3px solid var(--navy3);padding:0 9px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.folder-tabs::-webkit-scrollbar{height:5px}
.folder-tabs::-webkit-scrollbar-track{background:var(--navy)}
.folder-tabs::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px}

.ftab{padding:18px 20px;font-size:32px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:6px solid transparent;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.ftab.active{color:var(--gold);border-bottom-color:var(--gold)}
.ftab-add{padding:32px 36px;color:var(--text3);cursor:pointer;font-size:58px;line-height:1;display:flex;align-items:center}
.content{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:36px 40px}
.folder-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.folder-name{font-size:50px;color:var(--gold);font-weight:600}
.folder-actions{display:flex;gap:18px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:36px;font-size:48px;font-family:inherit;cursor:pointer;font-weight:600;width:100%;margin-bottom:36px;-webkit-tap-highlight-color:transparent}
.rcard{background:var(--card);border:3px solid var(--navy3);border-radius:var(--r);padding:36px 40px;margin-bottom:27px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rcard.open{border-color:var(--gold)}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:18px}
.rtitle{font-size:50px;color:var(--text);font-weight:600}
.rbadge{font-size:36px;padding:9px 27px;border-radius:45px;background:var(--navy3);color:var(--text2);white-space:nowrap;flex-shrink:0;font-weight:500}
.rmeta{font-size:39px;color:var(--text3);margin-top:14px}
.rdetail{display:none;margin-top:27px;padding-top:27px;border-top:3px solid var(--navy3)}
.rfield{margin-bottom:27px}
.rlabel{font-size:33px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:9px;font-weight:600}
.rval{color:var(--text2);font-size:45px;word-break:break-all;white-space:pre-wrap}
.pw-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.pw-text{font-family:'SF Mono','Fira Code','Courier New',monospace;letter-spacing:4px;font-size:50px;color:var(--text2)}
.rbtns{display:flex;gap:22px;margin-top:27px}
.sbtn{background:transparent;border:3px solid var(--navy3);color:var(--text2);border-radius:14px;padding:22px 40px;font-size:40px;font-weight:500;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.dbtn{border-color:#4a2222;color:var(--danger)}
.lbtn{border-color:var(--gold);color:var(--gold)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty p{font-size:50px;margin-bottom:18px;color:var(--text2)}
.empty span{font-size:40px}
.modal-bg{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:1080px;padding:54px 50px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-size:58px;color:var(--gold);margin-bottom:40px;font-weight:600}
.notice{font-size:39px;color:var(--text3);text-align:center;padding:22px 32px;background:var(--navy);border-radius:var(--r2);margin-bottom:36px;line-height:1.5}
.fg{margin-bottom:36px}
.fl{font-size:36px;color:var(--text3);margin-bottom:14px;display:block;text-transform:uppercase;letter-spacing:2px;font-weight:600}
.fi{width:100%;background:var(--navy);border:3px solid var(--navy3);border-radius:var(--r2);padding:30px 33px;color:var(--text);font-size:45px;font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
select.fi option{background:#1a2340}
textarea.fi{resize:none;overflow:hidden;line-height:1.5}
.mactions{display:flex;gap:27px;margin-top:22px}
.bp{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:33px;font-size:48px;font-family:inherit;cursor:pointer;font-weight:600}
.bc{flex:1;background:transparent;color:var(--text2);border:3px solid var(--navy3);border-radius:var(--r2);padding:33px;font-size:48px;font-family:inherit;cursor:pointer}
.ssect{margin-bottom:50px;padding-bottom:50px;border-bottom:3px solid var(--navy3)}
.ssect:last-child{border-bottom:none;margin-bottom:0}
.ssect h3{font-size:36px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:32px}
.stbtn{width:100%;background:var(--card2);border:3px solid var(--navy3);color:var(--text);border-radius:var(--r2);padding:32px 36px;font-size:45px;font-family:inherit;cursor:pointer;text-align:left;margin-bottom:22px;font-weight:500}
.danger-btn{color:var(--danger)}
.loading{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:45px}
.spinner{display:inline-block;width:72px;height:72px;border:4px solid var(--navy3);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:32px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:63px;left:50%;transform:translateX(-50%) translateY(180px);background:var(--success);color:#fff;padding:27px 58px;border-radius:54px;font-size:40px;font-weight:500;z-index:999;transition:transform 0.3s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.toast.warn{background:#b87a00}

@media (min-width: 769px) {
  .folder-tabs::-webkit-scrollbar{height:12px}
  .folder-tabs::-webkit-scrollbar-thumb{border-radius:6px}
}
.hbtn{background:transparent;border:2px solid var(--navy3);color:var(--text2);border-radius:8px;padding:8px 16px;font-size:22px;font-weight:500;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.hbtn-del{border-color:#4a2222;color:var(--danger)}
.hbtn-add{border-color:var(--gold);color:var(--gold)}

@media (min-width: 769px) {
  body {
    transform: none !important;
    width: 780px !important;
    position: relative !important;
    margin: 0 auto !important;
    overflow: auto !important;
    min-height: 100vh !important;
  }
  #pin-screen {
    width: 100% !important;
    height: auto !important;
    min-height: 100vh !important;
    padding: 40px 40px !important;
  }
  #main-app {
    width: 100% !important;
    height: 100vh !important;
  }
  #content {
    flex: 1 !important;
    height: auto !important;
    overflow-y: auto !important;
  }
  .app-title { font-size: 28px !important; }
  .app-sub { font-size: 14px !important; }
  .pin-phase { font-size: 13px !important; }
  .pin-dot { width: 16px !important; height: 16px !important; }
  .pin-dots { gap: 12px !important; margin-bottom: 1.5rem !important; }
  .key { height: 60px !important; font-size: 22px !important; }
  .keypad { max-width: 280px !important; gap: 10px !important; }
  .vault-icon { width: 72px !important; height: 72px !important; margin-bottom: 1rem !important; }
  .pin-msg { font-size: 13px !important; }
  .topbar { padding: 10px 16px !important; }
  .topbar-title { font-size: 18px !important; letter-spacing: 2px !important; }
  .icon-btn { width: 36px !important; height: 36px !important; font-size: 16px !important; }
  .sync-status { font-size: 12px !important; }
  .search-bar { padding: 8px 16px !important; }
  .search-wrap input { font-size: 14px !important; padding: 8px 8px 8px 32px !important; }
  .si { font-size: 14px !important; left: 10px !important; }
  .ftab { font-size: 14px !important; padding: 10px 14px !important; }
  .folder-tabs { padding: 0 16px !important; }
  .folder-tabs::-webkit-scrollbar { height: 6px !important; }
  .folder-name { font-size: 15px !important; }
  .hbtn { font-size: 12px !important; padding: 5px 10px !important; }
  .add-btn { font-size: 14px !important; padding: 10px !important; margin-bottom: 10px !important; }
  .rcard { padding: 12px 14px !important; margin-bottom: 8px !important; }
  .rtitle { font-size: 15px !important; }
  .rbadge { font-size: 11px !important; padding: 3px 8px !important; }
  .rmeta { font-size: 12px !important; }
  .rlabel { font-size: 11px !important; }
  .rval { font-size: 13px !important; }
  .pw-text { font-size: 14px !important; }
  .sbtn { font-size: 12px !important; padding: 6px 12px !important; }
  .modal { padding: 20px 18px !important; }
  .modal-title { font-size: 18px !important; }
  .notice { font-size: 12px !important; }
  .fl { font-size: 12px !important; }
  .fi { font-size: 14px !important; padding: 9px 12px !important; }
  .bp { font-size: 14px !important; padding: 10px !important; }
  .bc { font-size: 14px !important; padding: 10px !important; }
  .ssect h3 { font-size: 11px !important; }
  .stbtn { font-size: 13px !important; padding: 10px 12px !important; }
  .folder-header { margin-bottom: 10px !important; }
  .content { padding: 12px 16px !important; }
}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="vault-icon">
    <svg viewBox="0 0 24 24" style="width:36px;height:36px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1.5" fill="var(--gold)" stroke="none"/>
    </svg>
  </div>
  <div class="app-title">VAULT</div>
  <div class="app-sub" id="psub">Connecting...</div>
  <div class="pin-phase" id="pphase">&nbsp;</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="keypad">
    <button class="key" onclick="pk('1')">1</button>
    <button class="key" onclick="pk('2')">2</button>
    <button class="key" onclick="pk('3')">3</button>
    <button class="key" onclick="pk('4')">4</button>
    <button class="key" onclick="pk('5')">5</button>
    <button class="key" onclick="pk('6')">6</button>
    <button class="key" onclick="pk('7')">7</button>
    <button class="key" onclick="pk('8')">8</button>
    <button class="key" onclick="pk('9')">9</button>
    <button class="key gold" onclick="cp()">&#x2715;</button>
    <button class="key" onclick="pk('0')">0</button>
    <button class="key gold" onclick="bk()">&#x232B;</button>
  </div>
  <div class="pin-msg" id="pmsg"></div>
</div>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-title">VAULT</div>
    <div class="topbar-right">
      <span class="sync-status" id="sync-status">&#9679; Synced</span>
      <button class="icon-btn" onclick="openSettings()" title="Settings">&#9881;</button>
      <button class="icon-btn" onclick="lockApp()" title="Lock">&#128274;</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="si">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search records..." oninput="doSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div class="folder-tabs" id="ftabs"></div>
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="rec-modal">
  <div class="modal">
    <div class="modal-title" id="rec-modal-title">New Record</div>
    <div class="notice">&#9729; Saved to Google Sheets &mdash; syncs across all devices</div>
    <div class="fg"><label class="fl">Title / Site Name</label><input class="fi" id="f-title" placeholder="e.g. Gmail, Netflix, HSBC" autocomplete="off" autocapitalize="words"></div>
    <div class="fg"><label class="fl">Record Type</label>
      <select class="fi" id="f-type" onchange="togUrlField()"><option>Website</option><option>App</option><option>Email</option><option>Banking</option><option>Social Media</option><option>Work</option><option>Shopping</option><option>Other</option></select>
    </div>
    <div class="fg" id="f-url-group"><label class="fl">Website URL</label><input class="fi" id="f-url" placeholder="https://example.com" autocomplete="off" autocapitalize="off" autocorrect="off" type="url"></div>
    <div class="fg"><label class="fl">Username / Login</label><input class="fi" id="f-login" placeholder="username or email" autocomplete="off" autocapitalize="off"></div>
    <div class="fg"><label class="fl">Password</label>
      <input class="fi" id="f-pw" type="password" placeholder="password" autocomplete="new-password">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="button" class="sbtn" onclick="togFormPw()" id="f-pw-eye">Show password</button>
        <button type="button" class="sbtn" onclick="cpFormPw()">Copy password</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Folder</label><select class="fi" id="f-folder"></select></div>
    <div class="fg"><label class="fl">Notes (optional)</label>
      <textarea class="fi" id="f-notes" placeholder="URL, account number, hint..." rows="3" oninput="autoGrow(this)"></textarea>
    </div>
    <div class="mactions">
      <button class="bc" onclick="closeModal('rec-modal')">Cancel</button>
      <button class="bp" id="save-rec-btn" onclick="saveRec()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="fol-modal">
  <div class="modal">
    <div class="modal-title" id="fol-modal-title">New Folder</div>
    <div class="fg"><label class="fl">Folder Name</label><input class="fi" id="f-fname" placeholder="e.g. Personal, Work, Shopping" autocapitalize="words"></div>
    <div class="mactions">
      <button class="bc" onclick="closeModal('fol-modal')">Cancel</button>
      <button class="bp" onclick="saveFol()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="set-modal">
  <div class="modal">
    <div class="modal-title">Settings</div>
    <div class="ssect">
      <h3>Change PIN</h3>
      <div class="fg"><label class="fl">New PIN (4 digits)</label><input class="fi" id="s-p1" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN"></div>
      <div class="fg"><label class="fl">Confirm PIN</label><input class="fi" id="s-p2" type="password" inputmode="numeric" maxlength="4" placeholder="Repeat PIN"></div>
      <div id="s-msg" style="font-size:17px;color:var(--danger);min-height:22px;margin-bottom:10px"></div>
      <button class="bp" style="width:100%" onclick="changePin()">Change PIN</button>
    </div>
    <div class="ssect">
      <h3>Data</h3>
      <p style="font-size:18px;color:var(--text3);line-height:1.6">Your records are stored in Google Sheets and sync automatically across all your devices. No manual backup needed.</p>
    </div>
    <div class="ssect">
      <h3>Danger Zone</h3>
      <button class="stbtn danger-btn" onclick="wipeAll()">&#128465; Erase all data &amp; reset PIN</button>
    </div>
    <div class="mactions"><button class="bc" style="flex:1" onclick="closeModal('set-modal')">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  function applyScale() {
    var sw = window.innerWidth || document.documentElement.clientWidth || screen.width;
    var sh = window.innerHeight || document.documentElement.clientHeight || screen.height;

    if (sw > 768) {
      // Desktop: reset any mobile styles, center with CSS margin auto
      document.body.style.transform = '';
      document.body.style.transformOrigin = '';
      document.body.style.width = '740px';
      document.body.style.position = 'relative';
      document.body.style.margin = '0 auto';
      document.body.style.overflow = 'auto';
      document.body.style.minHeight = '100vh';
      var ps = document.getElementById('pin-screen');
      ps.style.width = '';
      ps.style.height = '';
      ps.style.minHeight = '100vh';
      var ma = document.getElementById('main-app');
      ma.style.width = '';
      ma.style.height = '100vh';
      ma.style.flexDirection = 'column';
      var ct = document.getElementById('content');
      if (ct) { ct.style.flex = '1'; ct.style.height = ''; ct.style.overflowY = 'auto'; }
      return;
    }

    // Mobile: scale to fill screen
    var scale = sw / 480;
    var logicalH = Math.round(sh / scale);
    document.body.style.transform = 'scale(' + scale + ')';
    document.body.style.transformOrigin = 'top left';
    document.body.style.width = '480px';
    document.body.style.margin = '0';
    document.body.style.position = 'absolute';
    document.body.style.overflow = 'hidden';
    var ps = document.getElementById('pin-screen');
    var ma = document.getElementById('main-app');
    ps.style.width = '480px';
    ps.style.height = logicalH + 'px';
    ma.style.width = '480px';
    ma.style.height = logicalH + 'px';
    setTimeout(function() {
      var content = document.getElementById('content');
      if (content) {
        var usedH = 0, children = ma.children;
        for (var i = 0; i < children.length; i++) { if (children[i] !== content) usedH += children[i].offsetHeight; }
        content.style.height = (logicalH - usedH) + 'px';
        content.style.flex = '';
      }
    }, 50);
  }
  applyScale();
  window.addEventListener('resize', applyScale);
})();

var API = 'https://script.google.com/macros/s/AKfycbxg5bbiRP6uFyRIvgZjPzYn6hN57St7KZQbwvoVyCsTTSiq7qbSkNqbLzrkojHjmQ_I/exec';

// ── Encryption (AES-GCM via WebCrypto) ──────────────────────────────────────
var _cryptoKey = null;

async function deriveKey(pin) {
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:enc.encode('vault-salt-v1'), iterations:100000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}

async function encryptStr(plaintext, key) {
  var enc = new TextEncoder();
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, enc.encode(plaintext));
  var buf = new Uint8Array(iv.byteLength + ct.byteLength);
  buf.set(iv, 0); buf.set(new Uint8Array(ct), iv.byteLength);
  return 'ENC:' + btoa(String.fromCharCode(...buf));
}

async function decryptStr(ciphertext, key) {
  if (!ciphertext || !ciphertext.startsWith('ENC:')) return ciphertext; // unencrypted legacy
  try {
    var raw = atob(ciphertext.slice(4));
    var buf = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i);
    var iv = buf.slice(0,12);
    var ct = buf.slice(12);
    var dec = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct);
    return new TextDecoder().decode(dec);
  } catch(e) { return ciphertext; } // fallback
}

async function encryptRecord(rec, key) {
  var r = Object.assign({}, rec);
  if (r.password) r.password = await encryptStr(r.password, key);
  if (r.login)    r.login    = await encryptStr(r.login,    key);
  if (r.notes)    r.notes    = await encryptStr(r.notes,    key);
  if (r.url)      r.url      = await encryptStr(r.url,      key);
  return r;
}

async function decryptRecord(rec, key) {
  var r = Object.assign({}, rec);
  r.password = await decryptStr(r.password||'', key);
  r.login    = await decryptStr(r.login||'',    key);
  r.notes    = await decryptStr(r.notes||'',    key);
  r.url      = await decryptStr(r.url||'',      key);
  return r;
}

// Migrate any unencrypted records on first login with new version
async function migrateIfNeeded(records, key) {
  var toSave = [];
  for (var i=0;i<records.length;i++) {
    var r = records[i];
    var needsMigration = (r.password && !r.password.startsWith('ENC:')) ||
                         (r.login    && !r.login.startsWith('ENC:'))    ||
                         (r.notes    && !r.notes.startsWith('ENC:'))    ||
                         (r.url      && !r.url.startsWith('ENC:'));
    if (needsMigration) toSave.push(await encryptRecord(r, key));
  }
  if (toSave.length > 0) {
    for (var j=0;j<toSave.length;j++) {
      api({action:'save', record:JSON.stringify(toSave[j])}, function(){});
    }
    console.log('Migrated ' + toSave.length + ' records to encrypted storage');
  }
}
// ── End Encryption ───────────────────────────────────────────────────────────

var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d){var day=d.getDate();return(day<10?'0':'')+day+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function cleanDate(s){if(!s)return '';if(s.indexOf('GMT')>=0||s.indexOf('00:00:00')>=0){try{var d=new Date(s);if(!isNaN(d))return fmtDate(d);}catch(e){}}return s;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}

function api(params,cb){
  var url=API+'?',parts=[],k;
  for(k in params)parts.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  url+=parts.join('&');
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.onload=function(){try{cb(null,JSON.parse(xhr.responseText));}catch(e){cb('Parse error');}};
  xhr.onerror=function(){cb('Network error');};
  xhr.send();
}

function initPin(){
  cur='';tmp='';updDots();
  document.getElementById('pmsg').textContent='';
  document.getElementById('psub').textContent='Connecting to your vault...';
  document.getElementById('pphase').textContent='';
  api({action:'getPin'},function(err,res){
    if(err||res.error){document.getElementById('psub').textContent='Could not connect.';document.getElementById('pmsg').textContent=err||res.error;return;}
    if(!res.pin){phase='new1';document.getElementById('psub').textContent='Welcome! Choose a 4-digit PIN.';document.getElementById('pphase').textContent='Step 1 of 2 \u2014 Enter new PIN';}
    else{phase='login';document.getElementById('psub').textContent='Enter your PIN to unlock';document.getElementById('pphase').textContent='';}
  });
}

function pk(k){if(cur.length>=4)return;cur+=k;updDots();document.getElementById('pmsg').textContent='';if(cur.length===4)setTimeout(h4,200);}
function bk(){cur=cur.slice(0,-1);updDots();}
function cp(){cur='';updDots();}
function updDots(){var i;for(i=0;i<4;i++)document.getElementById('d'+i).className='pin-dot'+(i<cur.length?' filled':'');}

function h4(){
  if(phase==='new1'){
    tmp=cur;cur='';phase='new2';updDots();
    document.getElementById('psub').textContent='Enter your PIN again to confirm';
    document.getElementById('pphase').textContent='Step 2 of 2 \u2014 Confirm PIN';
  }else if(phase==='new2'){
    if(cur===tmp){
      document.getElementById('pphase').textContent='Saving PIN...';
      api({action:'setPin',pin:cur},function(err){if(err){document.getElementById('pmsg').textContent='Could not save PIN.';cur='';updDots();return;}openApp();});
    }else{
      document.getElementById('pmsg').textContent='PINs did not match. Start again.';
      flashErr();cur='';tmp='';phase='new1';updDots();
      document.getElementById('psub').textContent='Choose a 4-digit PIN.';
      document.getElementById('pphase').textContent='Step 1 of 2 \u2014 Enter new PIN';
    }
  }else{
    if(_pinLocked){
      document.getElementById('pmsg').textContent='Vault locked. Reload the page to try again.';
      cur='';updDots();return;
    }
    api({action:'getPin'},function(err,res){
      if(err||res.error){document.getElementById('pmsg').textContent='Connection error.';cur='';updDots();return;}
      if(cur===String(res.pin)){
        _pinAttempts=0;
        document.getElementById('pphase').textContent='Unlocking…';
        deriveKey(cur).then(function(key){_cryptoKey=key;openApp();});
      }else{
        _pinAttempts++;
        var left=3-_pinAttempts;
        if(_pinAttempts>=3){
          _pinLocked=true;
          flashErr();cur='';updDots();
          document.getElementById('pmsg').textContent='Too many wrong attempts — Vault locked. Reload to try again.';
        }else{
          document.getElementById('pmsg').textContent='Incorrect PIN. '+left+' attempt'+(left===1?'':'s')+' remaining.';
          flashErr();cur='';updDots();
        }
      }
    });
  }
}

function lockApp(){_pinAttempts=0;_pinLocked=false;_cryptoKey=null;stopInactivityTimer();

  document.getElementById('search-input').value='';
  S={folders:[],records:[],af:'all'};
  // ── Inactivity timer ─────────────────────────────────────────────────────────
var _inactTimer = null;
var _warnTimer = null;
var _INACTIVE_MS = 5 * 60 * 1000;  // 5 minutes
var _WARN_MS = 4.5 * 60 * 1000;    // warn at 4m30s (30s before lock)

function resetInactivityTimer() {
  if (!_cryptoKey) return; // only run when logged in
  clearTimeout(_inactTimer);
  clearTimeout(_warnTimer);
  // dismiss any warning
  var t = document.getElementById('toast');
  if (t && t.className.indexOf('warn') >= 0) t.className = 'toast';

  _warnTimer = setTimeout(function() {
    toastWarn('Locking in 30 seconds due to inactivity…');
  }, _WARN_MS);

  _inactTimer = setTimeout(function() {
    lockApp();
    toast('Locked due to inactivity');
  }, _INACTIVE_MS);
}

function stopInactivityTimer() {
  clearTimeout(_inactTimer);
  clearTimeout(_warnTimer);
  _inactTimer = null;
  _warnTimer = null;
}

function toastWarn(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show warn';
}

// Reset timer on any user interaction
['touchstart','mousedown','mousemove','keypress','scroll','click'].forEach(function(evt) {
  document.addEventListener(evt, resetInactivityTimer, true);
});

// Lock immediately if page becomes visible after being hidden too long
var _hiddenAt = null;
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    _hiddenAt = Date.now();
  } else {
    if (_hiddenAt && _cryptoKey) {
      var away = Date.now() - _hiddenAt;
      if (away >= _INACTIVE_MS) {
        lockApp();
        toast('Locked due to inactivity');
      } else {
        resetInactivityTimer();
      }
    }
    _hiddenAt = null;
  }
});
// ── End inactivity timer ──────────────────────────────────────────────────────

initPin();
}

    if(err||res.error){setSyncStatus('err');document.getElementById('content').innerHTML='<div class="loading">Could not load records.</div>';return;}
    var rawRecords=res.records||[];

    // Decrypt all records then migrate any unencrypted ones

for(i=0;i<mbs.length;i++){mbs[i].addEventListener('click',function(e){if(e.target===this)this.className='modal-bg';});}
var _tt=null;
function toast(msg,isErr){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isErr?' err':'');if(_tt)clearTimeout(_tt);_tt=setTimeout(function(){t.className='toast';},2400);}

// ── Inactivity timer ─────────────────────────────────────────────────────────
var _inactTimer = null;
var _warnTimer = null;
var _INACTIVE_MS = 5 * 60 * 1000;  // 5 minutes
var _WARN_MS = 4.5 * 60 * 1000;    // warn at 4m30s (30s before lock)

function resetInactivityTimer() {
  if (!_cryptoKey) return; // only run when logged in
  clearTimeout(_inactTimer);
  clearTimeout(_warnTimer);
  // dismiss any warning
  var t = document.getElementById('toast');
  if (t && t.className.indexOf('warn') >= 0) t.className = 'toast';

  _warnTimer = setTimeout(function() {
    toastWarn('Locking in 30 seconds due to inactivity…');
  }, _WARN_MS);

  _inactTimer = setTimeout(function() {
    lockApp();
    toast('Locked due to inactivity');
  }, _INACTIVE_MS);
}

function stopInactivityTimer() {
  clearTimeout(_inactTimer);
  clearTimeout(_warnTimer);
  _inactTimer = null;
  _warnTimer = null;
}

function toastWarn(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show warn';
}

// Reset timer on any user interaction
['touchstart','mousedown','mousemove','keypress','scroll','click'].forEach(function(evt) {
  document.addEventListener(evt, resetInactivityTimer, true);
});

// Lock immediately if page becomes visible after being hidden too long
var _hiddenAt = null;
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    _hiddenAt = Date.now();
  } else {
    if (_hiddenAt && _cryptoKey) {
      var away = Date.now() - _hiddenAt;
      if (away >= _INACTIVE_MS) {
        lockApp();
        toast('Locked due to inactivity');
      } else {
        resetInactivityTimer();
      }
    }
    _hiddenAt = null;
  }
});
// ── End inactivity timer ──────────────────────────────────────────────────────

initPin();
</script>
