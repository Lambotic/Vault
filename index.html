<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2340;--navy3:#2d3a5c;--gold:#c9a84c;--text:#f0f0f0;--text2:#a0a8bb;--text3:#6b7490;--card:#1e2744;--card2:#252f50;--danger:#e24b4a;--success:#1a9e75;--r:24px;--r2:16px}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--navy);color:var(--text);width:100%;position:relative;top:0;left:0}

/* PIN SCREEN */
#pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 40px;min-height:100vh}
.vault-icon{width:100px;height:100px;border-radius:50%;background:var(--card2);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.app-title{font-size:52px;color:var(--gold);letter-spacing:8px;margin-bottom:12px;font-weight:600}
.app-sub{font-size:28px;color:var(--text2);margin-bottom:8px;text-align:center;line-height:1.4}
.pin-phase{font-size:24px;color:var(--gold);margin-bottom:20px;text-align:center;min-height:28px}
.pin-dots{display:flex;gap:20px;margin-bottom:28px}
.pin-dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--text3)}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.key{height:100px;border-radius:var(--r2);border:2px solid var(--navy3);background:var(--card2);color:var(--text);font-size:42px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;font-family:inherit}
.key:active{background:var(--navy3)}
.key.gold{color:var(--gold)}
.pin-msg{font-size:26px;color:var(--danger);margin-top:14px;min-height:32px;text-align:center}

/* MAIN APP */
#main-app{display:none;flex-direction:column;overflow:hidden;width:100%}
.topbar{background:var(--card);border-bottom:2px solid var(--navy3);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:34px;color:var(--gold);letter-spacing:4px;font-weight:600}
.topbar-right{display:flex;gap:12px;align-items:center}
.icon-btn{width:60px;height:60px;border-radius:var(--r2);border:2px solid var(--navy3);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;font-size:30px}
.icon-btn:active{background:var(--card2)}
.sync-status{font-size:20px;color:var(--text3);margin-right:6px}
.sync-status.ok{color:var(--success)}
.sync-status.err{color:var(--danger)}
.search-bar{padding:16px 24px;background:var(--card);border-bottom:2px solid var(--navy3);flex-shrink:0}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--navy);border:2px solid var(--navy3);border-radius:var(--r2);padding:16px 16px 16px 52px;color:var(--text);font-size:26px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:26px;pointer-events:none}
.folder-tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--navy3);padding:0 12px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.folder-tabs::-webkit-scrollbar{height:5px}
.folder-tabs::-webkit-scrollbar-track{background:var(--navy)}
.folder-tabs::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px}
.ftab{padding:16px 18px;font-size:26px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.ftab.active{color:var(--gold);border-bottom-color:var(--gold)}
.content{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 24px}
.folder-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.folder-name{font-size:30px;color:var(--gold);font-weight:600}
.folder-actions{display:flex;gap:10px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:20px;font-size:28px;font-family:inherit;cursor:pointer;font-weight:600;width:100%;margin-bottom:20px;-webkit-tap-highlight-color:transparent}

/* RECORD CARDS - large for mobile readability */
.rcard{background:var(--card);border:2px solid var(--navy3);border-radius:var(--r);padding:24px 28px;margin-bottom:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rcard.open{border-color:var(--gold)}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rtitle{font-size:34px;color:var(--text);font-weight:600}
.rbadge{font-size:22px;padding:6px 18px;border-radius:30px;background:var(--navy3);color:var(--text2);white-space:nowrap;flex-shrink:0;font-weight:500}
.rmeta{font-size:24px;color:var(--text3);margin-top:8px}
.rdetail{display:none;margin-top:18px;padding-top:18px;border-top:2px solid var(--navy3)}
.rfield{margin-bottom:18px}
.rlabel{font-size:20px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.rval{color:var(--text2);font-size:28px;word-break:break-all;white-space:pre-wrap}
.pw-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pw-text{font-family:'SF Mono','Fira Code','Courier New',monospace;letter-spacing:3px;font-size:30px;color:var(--text2)}
.rbtns{display:flex;gap:12px;margin-top:18px;justify-content:space-between;align-items:center}
.sbtn{background:transparent;border:2px solid var(--navy3);color:var(--text2);border-radius:10px;padding:12px 24px;font-size:24px;font-weight:500;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.dbtn{border-color:#4a2222;color:var(--danger)}
.lbtn{border-color:var(--gold);color:var(--gold)}
.hbtn{background:transparent;border:2px solid var(--navy3);color:var(--text2);border-radius:8px;padding:8px 16px;font-size:20px;font-weight:500;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.hbtn-del{border-color:#4a2222;color:var(--danger)}
.hbtn-add{border-color:var(--gold);color:var(--gold)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty p{font-size:30px;margin-bottom:10px;color:var(--text2)}
.empty span{font-size:24px}

/* MODALS */
.modal-bg{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:100%;padding:30px 28px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-size:34px;color:var(--gold);margin-bottom:22px;font-weight:600}
.notice{font-size:22px;color:var(--text3);text-align:center;padding:14px 18px;background:var(--navy);border-radius:var(--r2);margin-bottom:20px;line-height:1.5}
.fg{margin-bottom:20px}
.fl{font-size:20px;color:var(--text3);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.fi{width:100%;background:var(--navy);border:2px solid var(--navy3);border-radius:var(--r2);padding:16px 18px;color:var(--text);font-size:26px;font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
select.fi option{background:#1a2340}
textarea.fi{resize:none;overflow:hidden;line-height:1.5}
.mactions{display:flex;gap:14px;margin-top:12px}
.bp{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:18px;font-size:28px;font-family:inherit;cursor:pointer;font-weight:600}
.bc{flex:1;background:transparent;color:var(--text2);border:2px solid var(--navy3);border-radius:var(--r2);padding:18px;font-size:28px;font-family:inherit;cursor:pointer}
.ssect{margin-bottom:26px;padding-bottom:26px;border-bottom:2px solid var(--navy3)}
.ssect:last-child{border-bottom:none;margin-bottom:0}
.ssect h3{font-size:20px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:16px}
.stbtn{width:100%;background:var(--card2);border:2px solid var(--navy3);color:var(--text);border-radius:var(--r2);padding:18px 20px;font-size:26px;font-family:inherit;cursor:pointer;text-align:left;margin-bottom:12px;font-weight:500}
.danger-btn{color:var(--danger)}
.loading{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:26px}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--navy3);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--success);color:#fff;padding:14px 30px;border-radius:30px;font-size:24px;font-weight:500;z-index:999;transition:transform 0.3s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.toast.warn{background:#b87a00}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="vault-icon">
    <svg viewBox="0 0 24 24" style="width:50px;height:50px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1.5" fill="var(--gold)" stroke="none"/>
    </svg>
  </div>
  <div class="app-title">VAULT</div>
  <div class="app-sub" id="psub">Connecting...</div>
  <div class="pin-phase" id="pphase">&nbsp;</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="keypad">
    <button class="key" onclick="pk('1')">1</button>
    <button class="key" onclick="pk('2')">2</button>
    <button class="key" onclick="pk('3')">3</button>
    <button class="key" onclick="pk('4')">4</button>
    <button class="key" onclick="pk('5')">5</button>
    <button class="key" onclick="pk('6')">6</button>
    <button class="key" onclick="pk('7')">7</button>
    <button class="key" onclick="pk('8')">8</button>
    <button class="key" onclick="pk('9')">9</button>
    <button class="key gold" onclick="cp()">&#x2715;</button>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-title">VAULT</div>
    <div class="topbar-right">
      <span class="sync-status" id="sync-status">&#9679; Synced</span>
      <button class="icon-btn" onclick="openSettings()" title="Settings">&#9881;</button>
      <button class="icon-btn" onclick="lockApp()" title="Lock">&#128274;</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="si">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search records..." oninput="doSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div class="folder-tabs" id="ftabs"></div>
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="rec-modal">
  <div class="modal">
    <div class="modal-title" id="rec-modal-title">New Record</div>
    <div class="notice">&#9729; Saved to Google Sheets &mdash; syncs across all devices</div>
    <div class="fg"><label class="fl">Title / Site Name</label><input class="fi" id="f-title" placeholder="e.g. Gmail, Netflix, HSBC" autocomplete="off" autocapitalize="words"></div>

      <select class="fi" id="f-type" onchange="togUrlField()"><option>Website</option><option>App</option><option>Email</option><option>Banking</option><option>Social Media</option><option>Work</option><option>Shopping</option><option>Other</option></select>
    </div>

      <input class="fi" id="f-pw" type="password" placeholder="password" autocomplete="new-password">
      <div style="display:flex;gap:10px;margin-top:10px">
        <button type="button" class="sbtn" onclick="togFormPw()" id="f-pw-eye">Show password</button>
        <button type="button" class="sbtn" onclick="cpFormPw()">Copy password</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Folder</label><select class="fi" id="f-folder"></select></div>
    <div class="fg"><label class="fl">Notes (optional)</label>
      <textarea class="fi" id="f-notes" placeholder="URL, account number, hint..." rows="3" oninput="autoGrow(this)"></textarea>
    </div>
    <div class="mactions">

      <button class="bp" id="save-rec-btn" onclick="saveRec()">Save</button>

  </div>
</div>

<div class="modal-bg" id="fol-modal">
  <div class="modal">
    <div class="modal-title" id="fol-modal-title">New Folder</div>

<div class="modal-bg" id="set-modal">
  <div class="modal">
    <div class="modal-title">Settings</div>
    <div class="ssect">
      <h3>Change PIN</h3>
      <div class="fg"><label class="fl">New PIN (4 digits)</label><input class="fi" id="s-p1" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN"></div>
      <div class="fg"><label class="fl">Confirm PIN</label><input class="fi" id="s-p2" type="password" inputmode="numeric" maxlength="4" placeholder="Repeat PIN"></div>
      <div id="s-msg" style="font-size:22px;color:var(--danger);min-height:28px;margin-bottom:12px"></div>
      <button class="bp" style="width:100%" onclick="changePin()">Change PIN</button>
    </div>
    <div class="ssect">
      <h3>Data</h3>
      <p style="font-size:22px;color:var(--text3);line-height:1.6">Your records are stored in Google Sheets and sync automatically across all your devices. No manual backup needed.</p>
    </div>
    <div class="ssect">
      <h3>Danger Zone</h3>
      <button class="stbtn danger-btn" onclick="wipeAll()">&#128465; Erase all data &amp; reset PIN</button>
    </div>
    <div class="mactions"><button class="bc" style="flex:1" onclick="closeModal('set-modal')">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// No scaling - CSS sized directly for iPhone
(function() {
  function setHeights() {
    var sh = window.innerHeight || document.documentElement.clientHeight || screen.height;
    var ps = document.getElementById('pin-screen');
    var ma = document.getElementById('main-app');
    if (ps) ps.style.minHeight = sh + 'px';
    if (ma) ma.style.height = sh + 'px';
    var content = document.getElementById('content');
    if (content && ma) {
      var usedH = 0, children = ma.children;
      for (var i = 0; i < children.length; i++) { if (children[i] !== content) usedH += children[i].offsetHeight; }
      content.style.height = (sh - usedH) + 'px';
    }
  }
  setHeights();
  window.addEventListener('resize', setHeights);
})();

var API = 'https://script.google.com/macros/s/AKfycbxg5bbiRP6uFyRIvgZjPzYn6hN57St7KZQbwvoVyCsTTSiq7qbSkNqbLzrkojHjmQ_I/exec';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d){var day=d.getDate();return(day<10?'0':'')+day+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function cleanDate(s){if(!s)return '';if(s.indexOf('GMT')>=0||s.indexOf('00:00:00')>=0){try{var d=new Date(s);if(!isNaN(d))return fmtDate(d);}catch(e){}}return s;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}

function api(params,cb){
  var url=API+'?',parts=[],k;
  for(k in params)parts.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  url+=parts.join('&');
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.onload=function(){try{cb(null,JSON.parse(xhr.responseText));}catch(e){cb('Parse error');}};
  xhr.onerror=function(){cb('Network error');};
  xhr.send();
}

function setSyncStatus(state){
  var el=document.getElementById('sync-status');
  if(state==='ok'){el.textContent='\u25cf Synced';el.className='sync-status ok';}
  else if(state==='syncing'){el.textContent='\u25cf Syncing...';el.className='sync-status';}
  else{el.textContent='\u25cf Offline';el.className='sync-status err';}
}

// Encryption
var _cryptoKey=null;
async function deriveKey(pin){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pin),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('vault-salt-v1'),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptStr(pt,key){
  var enc=new TextEncoder();
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(pt));
  var buf=new Uint8Array(iv.byteLength+ct.byteLength);
  buf.set(iv,0);buf.set(new Uint8Array(ct),iv.byteLength);
  return 'ENC:'+btoa(String.fromCharCode(...buf));
}
async function decryptStr(ct,key){
  if(!ct||!ct.startsWith('ENC:'))return ct;
  try{
    var raw=atob(ct.slice(4));
    var buf=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)buf[i]=raw.charCodeAt(i);
    var dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
    return new TextDecoder().decode(dec);
  }catch(e){return ct;}
}
async function encryptRecord(r,key){
  var o=Object.assign({},r);
  if(o.password)o.password=await encryptStr(o.password,key);
  if(o.login)o.login=await encryptStr(o.login,key);
  if(o.notes)o.notes=await encryptStr(o.notes,key);
  if(o.url)o.url=await encryptStr(o.url,key);
  return o;
}
async function decryptRecord(r,key){
  var o=Object.assign({},r);
  o.password=await decryptStr(o.password||'',key);
  o.login=await decryptStr(o.login||'',key);
  o.notes=await decryptStr(o.notes||'',key);
  o.url=await decryptStr(o.url||'',key);
  return o;
}
async function migrateIfNeeded(records,key){
  var toSave=[];
  for(var i=0;i<records.length;i++){
    var r=records[i];
    if((r.password&&!r.password.startsWith('ENC:'))||(r.login&&!r.login.startsWith('ENC:'))||(r.notes&&!r.notes.startsWith('ENC:'))||(r.url&&!r.url.startsWith('ENC:')))
      toSave.push(await encryptRecord(r,key));
  }
  for(var j=0;j<toSave.length;j++)api({action:'save',record:JSON.stringify(toSave[j])},function(){});
}

// PIN lockout
var _pinAttempts=0,_pinLocked=false;

// Inactivity timer
var _inactTimer=null,_warnTimer=null,_INACTIVE_MS=5*60*1000,_WARN_MS=4.5*60*1000;
function resetInactivityTimer(){
  if(!_cryptoKey)return;
  clearTimeout(_inactTimer);clearTimeout(_warnTimer);
  var t=document.getElementById('toast');
  if(t&&t.className.indexOf('warn')>=0)t.className='toast';
  _warnTimer=setTimeout(function(){toastWarn('Locking in 30 seconds\u2026');},_WARN_MS);
  _inactTimer=setTimeout(function(){lockApp();toast('Locked due to inactivity');},_INACTIVE_MS);
}
function stopInactivityTimer(){clearTimeout(_inactTimer);clearTimeout(_warnTimer);}
function toastWarn(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show warn';}
['touchstart','mousedown','mousemove','keypress','scroll','click'].forEach(function(evt){document.addEventListener(evt,resetInactivityTimer,true);});
var _hiddenAt=null;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){_hiddenAt=Date.now();}
  else{if(_hiddenAt&&_cryptoKey){var away=Date.now()-_hiddenAt;if(away>=_INACTIVE_MS){lockApp();toast('Locked due to inactivity');}else resetInactivityTimer();}_hiddenAt=null;}
});

var S={folders:[],records:[],af:'all'};
var cur='',phase='new1',tmp='';
var eRec=null,eFol=null;

function initPin(){
  cur='';tmp='';updDots();
  document.getElementById('pmsg').textContent='';
  document.getElementById('psub').textContent='Connecting to your vault...';
  document.getElementById('pphase').textContent='';
  api({action:'getPin'},function(err,res){
    if(err||res.error){document.getElementById('psub').textContent='Could not connect.';document.getElementById('pmsg').textContent=err||res.error;return;}
    var pinVal=res.pin!==undefined&&res.pin!==null&&res.pin!==''?String(res.pin):'';
    if(!pinVal){phase='new1';document.getElementById('psub').textContent='Welcome! Choose a 4-digit PIN.';document.getElementById('pphase').textContent='Step 1 of 2 \u2014 Enter new PIN';}
    else{phase='login';document.getElementById('psub').textContent='Enter your PIN to unlock';document.getElementById('pphase').textContent='';}
  });
}

function pk(k){if(cur.length>=4)return;cur+=k;updDots();document.getElementById('pmsg').textContent='';if(cur.length===4)setTimeout(h4,200);}
function bk(){cur=cur.slice(0,-1);updDots();}
function cp(){cur='';updDots();}
function updDots(){var i;for(i=0;i<4;i++)document.getElementById('d'+i).className='pin-dot'+(i<cur.length?' filled':'');}

function h4(){
  if(phase==='new1'){
    tmp=cur;cur='';phase='new2';updDots();
    document.getElementById('psub').textContent='Enter your PIN again to confirm';
    document.getElementById('pphase').textContent='Step 2 of 2 \u2014 Confirm PIN';
  }else if(phase==='new2'){
    if(cur===tmp){
      document.getElementById('pphase').textContent='Saving PIN...';
      var pinToSave=cur;
      api({action:'setPin',pin:pinToSave},function(err){
        if(err){
          api({action:'getPin'},function(err2,res2){
            if(!err2&&res2&&String(res2.pin)===pinToSave){deriveKey(pinToSave).then(function(key){_cryptoKey=key;openApp();});}
            else{document.getElementById('pmsg').textContent='Could not save PIN. Try again.';cur='';updDots();}
          });return;
        }
        deriveKey(pinToSave).then(function(key){_cryptoKey=key;openApp();});
      });
    }else{
      document.getElementById('pmsg').textContent='PINs did not match. Start again.';
      flashErr();cur='';tmp='';phase='new1';updDots();
      document.getElementById('psub').textContent='Choose a 4-digit PIN.';
      document.getElementById('pphase').textContent='Step 1 of 2 \u2014 Enter new PIN';
    }
  }else{
    if(_pinLocked){document.getElementById('pmsg').textContent='Vault locked. Reload to try again.';cur='';updDots();return;}
    api({action:'getPin'},function(err,res){
      if(err||res.error){document.getElementById('pmsg').textContent='Connection error.';cur='';updDots();return;}
      if(cur===String(res.pin)||cur===res.pin){
        _pinAttempts=0;
        document.getElementById('pphase').textContent='Unlocking\u2026';
        deriveKey(cur).then(function(key){_cryptoKey=key;openApp();});
      }else{
        _pinAttempts++;
        var left=3-_pinAttempts;
        if(_pinAttempts>=3){_pinLocked=true;flashErr();cur='';updDots();document.getElementById('pmsg').textContent='Too many wrong attempts \u2014 Vault locked. Reload to try again.';}
        else{document.getElementById('pmsg').textContent='Incorrect PIN. '+left+' attempt'+(left===1?'':'s')+' remaining.';flashErr();cur='';updDots();}
      }
    });
  }
}

function flashErr(){
  var i;for(i=0;i<4;i++)document.getElementById('d'+i).className='pin-dot error';
  setTimeout(function(){var j;for(j=0;j<4;j++)document.getElementById('d'+j).className='pin-dot';},700);
}

function openApp(){
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('main-app').style.display='flex';
  resetInactivityTimer();
  setTimeout(function(){
    var sh=window.innerHeight||document.documentElement.clientHeight||screen.height;
    var ma=document.getElementById('main-app');
    var content=document.getElementById('content');
    if(ma&&content){
      ma.style.height=sh+'px';
      var usedH=0,children=ma.children;
      for(var i=0;i<children.length;i++){if(children[i]!==content)usedH+=children[i].offsetHeight;}
      content.style.height=(sh-usedH)+'px';
    }
  },50);
  loadAll();
}

function lockApp(){_pinAttempts=0;_pinLocked=false;_cryptoKey=null;stopInactivityTimer();
  document.getElementById('main-app').style.display='none';
  document.getElementById('pin-screen').style.display='flex';
  document.getElementById('search-input').value='';
  S={folders:[],records:[],af:'all'};
  initPin();
}

function loadAll(){
  setSyncStatus('syncing');
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div><br>Loading your records...</div>';
  api({action:'getAll'},function(err,res){
    if(err||res.error){setSyncStatus('err');document.getElementById('content').innerHTML='<div class="loading">Could not load records.</div>';return;}
    var rawRecords=res.records||[];S.folders=res.folders||[];
    Promise.all(rawRecords.map(function(r){return decryptRecord(r,_cryptoKey);})).then(function(decrypted){
      S.records=decrypted;setSyncStatus('ok');renderTabs();renderContent();migrateIfNeeded(rawRecords,_cryptoKey);
    });
  });
}

function renderTabs(){
  var i,f,sorted,html;
  sorted=S.folders.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  html='<div class="ftab'+(S.af==='all'?' active':'')+'" onclick="setFol(\'all\')">All</div>';
  for(i=0;i<sorted.length;i++){f=sorted[i];html+='<div class="ftab'+(S.af===f.id?' active':'')+'" onclick="setFol(\''+f.id+'\')">'+esc(f.name)+'</div>';}
  document.getElementById('ftabs').innerHTML=html;
}
function setFol(id){S.af=id;renderTabs();renderContent();}

function openAddFol(){eFol=null;document.getElementById('fol-modal-title').textContent='New Folder';document.getElementById('f-fname').value='';openModal('fol-modal');}
function editFol(id){
  var i,f=null;for(i=0;i<S.folders.length;i++){if(S.folders[i].id===id){f=S.folders[i];break;}}
  if(!f)return;eFol=id;document.getElementById('fol-modal-title').textContent='Rename Folder';document.getElementById('f-fname').value=f.name;openModal('fol-modal');
}
function saveFol(){
  var i,found=false,name=document.getElementById('f-fname').value.trim();if(!name)return;
  var folder={id:eFol?eFol:('f'+Date.now()),name:name};setSyncStatus('syncing');
  api({action:'saveFolder',folder:JSON.stringify(folder)},function(err){
    if(err){toast('Could not save folder',true);setSyncStatus('err');return;}
    if(eFol){for(i=0;i<S.folders.length;i++){if(S.folders[i].id===eFol){S.folders[i].name=name;found=true;break;}}}
    if(!found){S.folders.push(folder);S.af=folder.id;}
    setSyncStatus('ok');renderTabs();renderContent();closeModal('fol-modal');
  });
}
function delFol(id){
  var i,fb=null;if(!confirm('Delete folder? Records inside will move to first available folder.'))return;
  for(i=0;i<S.folders.length;i++){if(S.folders[i].id!==id){fb=S.folders[i];break;}}
  setSyncStatus('syncing');
  api({action:'deleteFolder',id:id},function(err){
    if(err){toast('Could not delete folder',true);setSyncStatus('err');return;}
    for(i=0;i<S.records.length;i++){if(S.records[i].folderId===id)S.records[i].folderId=fb?fb.id:'';}
    S.folders=S.folders.filter(function(f){return f.id!==id;});
    S.af='all';setSyncStatus('ok');renderTabs();renderContent();
  });
}

function getVisible(){
  var i,out,q=document.getElementById('search-input').value.toLowerCase().trim(),r=S.records.slice();
  if(q){out=[];for(i=0;i<r.length;i++){if(r[i].title.toLowerCase().indexOf(q)>=0)out.push(r[i]);}
    out.sort(function(a,b){var ai=a.title.toLowerCase().indexOf(q)===0?0:1,bi=b.title.toLowerCase().indexOf(q)===0?0:1;return ai!==bi?ai-bi:a.title.localeCompare(b.title);});return out;}
  if(S.af!=='all')r=r.filter(function(x){return x.folderId===S.af;});
  return r.sort(function(a,b){return a.title.localeCompare(b.title);});
}
function doSearch(){renderContent();}

function renderContent(){
  var i,fi,recs=getVisible(),q=document.getElementById('search-input').value.trim(),fname='All Records';
  if(S.af!=='all'){for(fi=0;fi<S.folders.length;fi++){if(S.folders[fi].id===S.af){fname=S.folders[fi].name;break;}}}
  var h='<div class="folder-header">';
  if(!q){h+='<div class="folder-name">'+esc(fname)+'</div>';
    if(S.af!=='all')h+='<div class="folder-actions"><button class="hbtn" onclick="editFol(\''+S.af+'\')">Rename</button> <button class="hbtn hbtn-del" onclick="delFol(\''+S.af+'\')">Delete</button> <button class="hbtn hbtn-add" onclick="openAddFol()">+ Folder</button></div>';
    else h+='<div class="folder-actions"><button class="hbtn hbtn-add" onclick="openAddFol()">+ Folder</button></div>';}
  else{h+='<div class="folder-name">Search results</div>';}
  h+='</div><button class="add-btn" onclick="openAddRec()">+ Add Record</button>';
  if(!recs.length){h+='<div class="empty"><p>'+(q?'No records found':'No records yet')+'</p><span>'+(q?'Try different search terms':'Tap Add Record to get started')+'</span></div>';}
  else{for(i=0;i<recs.length;i++)h+=buildCard(recs[i]);}
  document.getElementById('content').innerHTML=h;
}

function buildCard(r){
  var i,fn='';for(i=0;i<S.folders.length;i++){if(S.folders[i].id===r.folderId){fn=S.folders[i].name;break;}}
  var h='<div class="rcard" id="rc-'+r.id+'" onclick="togCard(\''+r.id+'\')">';
  h+='<div class="rtop"><div class="rtitle">'+esc(r.title)+'</div><span class="rbadge">'+esc(r.type)+'</span></div>';
  h+='<div class="rmeta">'+(fn?esc(fn)+' \u00b7 ':'')+cleanDate(r.created)+'</div>';
  h+='<div class="rdetail" id="rd-'+r.id+'">';
  if(r.url){h+='<div class="rfield"><div class="rlabel">Website URL</div><div class="pw-row"><div class="rval">'+esc(r.url)+'</div><button class="sbtn lbtn" onclick="launchUrl(event,\''+r.id+'\')">&#127760; Launch</button></div></div>';}
  h+='<div class="rfield"><div class="rlabel">Login / Username</div><div class="rval">'+esc(r.login||'-')+'</div></div>';
  h+='<div class="rfield"><div class="rlabel">Password</div><div class="pw-row"><span class="pw-text" id="pw-'+r.id+'">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>';
  h+='<button class="sbtn" onclick="togPw(event,\''+r.id+'\')">Show</button><button class="sbtn" onclick="cpPw(event,\''+r.id+'\')">Copy</button></div></div>';
  if(r.notes)h+='<div class="rfield"><div class="rlabel">Notes</div><div class="rval">'+esc(r.notes)+'</div></div>';
  h+='<div class="rbtns"><div style="display:flex;gap:10px"><button class="sbtn" onclick="editRec(event,\''+r.id+'\')">Edit</button><button class="sbtn dbtn" onclick="delRec(event,\''+r.id+'\')">Delete</button></div><button class="sbtn" onclick="event.stopPropagation();togCard(\''+r.id+'\')">Close</button></div>';
  h+='</div></div>';return h;
}

function togCard(id){var d=document.getElementById('rd-'+id),c=document.getElementById('rc-'+id);if(d.style.display==='block'){d.style.display='none';c.className='rcard';}else{d.style.display='block';c.className='rcard open';}}
function getRec(id){var i;for(i=0;i<S.records.length;i++){if(S.records[i].id===id)return S.records[i];}return null;}
function togPw(e,id){e.stopPropagation();var r=getRec(id);if(!r)return;var el=document.getElementById('pw-'+id);if(el.getAttribute('data-shown')==='1'){el.textContent='\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7';el.removeAttribute('data-shown');}else{el.textContent=r.password;el.setAttribute('data-shown','1');}}
function cpPw(e,id){e.stopPropagation();var r=getRec(id);if(!r)return;if(navigator.clipboard){navigator.clipboard.writeText(r.password).then(function(){toast('Password copied!');}).catch(function(){fbCopy(r.password);});}else fbCopy(r.password);}
function fbCopy(v){var t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('Password copied!');}
function launchUrl(e,id){e.stopPropagation();var r=getRec(id);if(!r||!r.url)return;var url=r.url.indexOf('://')<0?'https://'+r.url:r.url;window.open(url,'_blank');}
function togFormPw(){var inp=document.getElementById('f-pw'),btn=document.getElementById('f-pw-eye');if(inp.type==='password'){inp.type='text';btn.textContent='Hide password';}else{inp.type='password';btn.textContent='Show password';}}
function cpFormPw(){var v=document.getElementById('f-pw').value;if(!v){toast('No password to copy',true);return;}if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){toast('Password copied!');}).catch(function(){fbCopy(v);});}else fbCopy(v);}
function togUrlField(){document.getElementById('f-url-group').style.display=(document.getElementById('f-type').value==='Website')?'block':'none';}

function fillFolSel(sel){var i,sorted=S.folders.slice().sort(function(a,b){return a.name.localeCompare(b.name);}),h='';for(i=0;i<sorted.length;i++)h+='<option value="'+sorted[i].id+'"'+(sorted[i].id===sel?' selected':'')+'>'+esc(sorted[i].name)+'</option>';document.getElementById('f-folder').innerHTML=h;}
function openAddRec(){
  eRec=null;document.getElementById('rec-modal-title').textContent='New Record';
  document.getElementById('f-title').value='';document.getElementById('f-login').value='';
  document.getElementById('f-pw').value='';document.getElementById('f-pw').type='password';
  document.getElementById('f-pw-eye').textContent='Show password';
  document.getElementById('f-notes').value='';document.getElementById('f-notes').style.height='auto';
  document.getElementById('f-type').value='Website';document.getElementById('f-url').value='';
  document.getElementById('f-url-group').style.display='block';
  fillFolSel(S.af==='all'?(S.folders[0]?S.folders[0].id:''):S.af);openModal('rec-modal');
}
function editRec(e,id){
  e.stopPropagation();var r=getRec(id);if(!r)return;eRec=id;
  document.getElementById('rec-modal-title').textContent='Edit Record';
  document.getElementById('f-title').value=r.title;document.getElementById('f-type').value=r.type;
  document.getElementById('f-login').value=r.login||'';document.getElementById('f-pw').value=r.password||'';
  document.getElementById('f-pw').type='password';document.getElementById('f-pw-eye').textContent='Show password';
  document.getElementById('f-notes').value=r.notes||'';document.getElementById('f-url').value=r.url||'';
  togUrlField();setTimeout(function(){autoGrow(document.getElementById('f-notes'));},50);
  fillFolSel(r.folderId);openModal('rec-modal');
}
function saveRec(){
  var i,title=document.getElementById('f-title').value.trim();if(!title)return;
  var ex=eRec?getRec(eRec):null;
  var rec={id:eRec?eRec:('r'+Date.now()),title:title,type:document.getElementById('f-type').value,
    url:document.getElementById('f-url').value.trim(),login:document.getElementById('f-login').value.trim(),
    password:document.getElementById('f-pw').value,folderId:document.getElementById('f-folder').value,
    notes:document.getElementById('f-notes').value.trim(),created:ex?ex.created:fmtDate(new Date())};
  document.getElementById('save-rec-btn').textContent='Saving...';document.getElementById('save-rec-btn').disabled=true;setSyncStatus('syncing');
  encryptRecord(rec,_cryptoKey).then(function(encRec){
    api({action:'save',record:JSON.stringify(encRec)},function(err,res){
      document.getElementById('save-rec-btn').textContent='Save';document.getElementById('save-rec-btn').disabled=false;
      if(err||!res||res.error){toast('Could not save. Try again.',true);setSyncStatus('err');return;}
      if(eRec){for(i=0;i<S.records.length;i++){if(S.records[i].id===eRec){S.records[i]=rec;break;}}}else S.records.push(rec);
      setSyncStatus('ok');renderContent();closeModal('rec-modal');toast(eRec?'Record updated':'Record saved');
    });
  });
}
function delRec(e,id){e.stopPropagation();if(!confirm('Delete this record? Cannot be undone.'))return;setSyncStatus('syncing');
  api({action:'delete',id:id},function(err){if(err){toast('Could not delete.',true);setSyncStatus('err');return;}
  S.records=S.records.filter(function(x){return x.id!==id;});setSyncStatus('ok');renderContent();toast('Deleted');});}

function openSettings(){document.getElementById('s-p1').value='';document.getElementById('s-p2').value='';document.getElementById('s-msg').textContent='';openModal('set-modal');}
function changePin(){
  var p1=document.getElementById('s-p1').value.trim(),p2=document.getElementById('s-p2').value.trim(),msg=document.getElementById('s-msg');
  if(!/^\d{4}$/.test(p1)){msg.textContent='PIN must be exactly 4 digits';return;}
  if(p1!==p2){msg.textContent='PINs do not match';return;}
  api({action:'setPin',pin:p1},function(err){
    if(err){msg.textContent='Could not save PIN.';return;}
    deriveKey(p1).then(function(newKey){
      var jobs=S.records.map(function(r){return encryptRecord(r,newKey).then(function(enc){return new Promise(function(resolve){api({action:'save',record:JSON.stringify(enc)},resolve);});});});
      Promise.all(jobs).then(function(){closeModal('set-modal');toast('PIN changed');setTimeout(lockApp,1800);});
    });
  });
}
function wipeAll(){if(!confirm('Delete ALL records, folders and PIN? Cannot be undone.'))return;if(!confirm('Are you absolutely sure?'))return;api({action:'setPin',pin:''},function(){});S={folders:[],records:[],af:'all'};lockApp();}
function openModal(id){document.getElementById(id).className='modal-bg open';}
function closeModal(id){document.getElementById(id).className='modal-bg';}
var i,mbs=document.querySelectorAll('.modal-bg');
for(i=0;i<mbs.length;i++){mbs[i].addEventListener('click',function(e){if(e.target===this)this.className='modal-bg';});}
var _tt=null;
function toast(msg,isErr){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isErr?' err':'');if(_tt)clearTimeout(_tt);_tt=setTimeout(function(){t.className='toast';},2400);}

initPin();
</script>
</body>
</html>
