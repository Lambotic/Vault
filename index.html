<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2340;--navy3:#2d3a5c;--gold:#c9a84c;--text:#f0f0f0;--text2:#a0a8bb;--text3:#6b7490;--card:#1e2744;--card2:#252f50;--danger:#e24b4a;--success:#1a9e75;--r:12px;--r2:8px}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:var(--navy);color:var(--text);max-width:480px;margin:0 auto;display:flex;flex-direction:column}
#pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:2rem}
.vault-icon{width:80px;height:80px;border-radius:50%;background:var(--card2);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem}
.app-title{font-size:26px;color:var(--gold);letter-spacing:4px;margin-bottom:0.5rem}
.app-sub{font-size:14px;color:var(--text2);margin-bottom:0.3rem;text-align:center;max-width:280px;line-height:1.5}
.pin-phase{font-size:12px;color:var(--gold);margin-bottom:1.4rem;text-align:center;min-height:16px;font-style:italic}
.pin-dots{display:flex;gap:14px;margin-bottom:2rem}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text3)}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:260px}
.key{height:62px;border-radius:var(--r2);border:1px solid var(--navy3);background:var(--card2);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.key:active{background:var(--navy3)}
.key.gold{color:var(--gold)}
.pin-msg{font-size:13px;color:var(--danger);margin-top:1rem;min-height:18px;text-align:center}
#main-app{display:none;flex-direction:column;height:100%;overflow:hidden}
.topbar{background:var(--card);border-bottom:1px solid var(--navy3);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:17px;color:var(--gold);letter-spacing:2px}
.topbar-right{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:var(--r2);border:1px solid var(--navy3);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;font-size:18px}
.icon-btn:active{background:var(--card2)}
.sync-status{font-size:11px;color:var(--text3);margin-right:4px}
.sync-status.ok{color:var(--success)}
.sync-status.err{color:var(--danger)}
.search-bar{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--navy3);flex-shrink:0}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--navy);border:1px solid var(--navy3);border-radius:var(--r2);padding:9px 10px 9px 34px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.folder-tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--navy3);padding:0 16px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.folder-tabs::-webkit-scrollbar{height:0}
.ftab{padding:10px 14px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;-webkit-tap-highlight-color:transparent}
.ftab.active{color:var(--gold);border-bottom-color:var(--gold)}
.ftab-add{padding:10px 14px;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center}
.content{flex:1;padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.folder-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.folder-name{font-size:15px;color:var(--gold)}
.folder-actions{display:flex;gap:6px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:10px 14px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;width:100%;margin-bottom:14px;-webkit-tap-highlight-color:transparent}
.rcard{background:var(--card);border:1px solid var(--navy3);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rcard.open{border-color:var(--gold)}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rtitle{font-size:15px;color:var(--text);font-weight:500}
.rbadge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--navy3);color:var(--text2);white-space:nowrap;flex-shrink:0}
.rmeta{font-size:12px;color:var(--text3);margin-top:5px}
.rdetail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--navy3)}
.rfield{margin-bottom:10px}
.rlabel{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
.rval{color:var(--text2);font-size:14px;word-break:break-all;white-space:pre-wrap}
.pw-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pw-text{font-family:monospace;letter-spacing:2px;font-size:15px;color:var(--text2)}
.rbtns{display:flex;gap:8px;margin-top:10px}
.sbtn{background:transparent;border:1px solid var(--navy3);color:var(--text2);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.dbtn{border-color:#4a2222;color:var(--danger)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty p{font-size:15px;margin-bottom:6px;color:var(--text2)}
.modal-bg{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;padding:22px 20px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-size:18px;color:var(--gold);margin-bottom:16px}
.notice{font-size:12px;color:var(--text3);text-align:center;padding:8px 12px;background:var(--navy);border-radius:var(--r2);margin-bottom:14px;line-height:1.5}
.fg{margin-bottom:14px}
.fl{font-size:12px;color:var(--text3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.5px}
.fi{width:100%;background:var(--navy);border:1px solid var(--navy3);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}
select.fi option{background:#1a2340}
textarea.fi{resize:none;overflow:hidden;line-height:1.5}
.mactions{display:flex;gap:10px;margin-top:8px}
.bp{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:var(--r2);padding:12px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:500}
.bc{flex:1;background:transparent;color:var(--text2);border:1px solid var(--navy3);border-radius:var(--r2);padding:12px;font-size:15px;font-family:inherit;cursor:pointer}
.ssect{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--navy3)}
.ssect:last-child{border-bottom:none;margin-bottom:0}
.ssect h3{font-size:13px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.stbtn{width:100%;background:var(--card2);border:1px solid var(--navy3);color:var(--text);border-radius:var(--r2);padding:11px 14px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left;margin-bottom:8px}
.danger-btn{color:var(--danger)}
.loading{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--navy3);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--success);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:999;transition:transform 0.3s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="vault-icon">
    <svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1.5" fill="var(--gold)" stroke="none"/>
    </svg>
  </div>
  <div class="app-title">VAULT</div>
  <div class="app-sub" id="psub">Connecting...</div>
  <div class="pin-phase" id="pphase">&nbsp;</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="keypad">
    <button class="key" onclick="pk('1')">1</button>
    <button class="key" onclick="pk('2')">2</button>
    <button class="key" onclick="pk('3')">3</button>
    <button class="key" onclick="pk('4')">4</button>
    <button class="key" onclick="pk('5')">5</button>
    <button class="key" onclick="pk('6')">6</button>
    <button class="key" onclick="pk('7')">7</button>
    <button class="key" onclick="pk('8')">8</button>
    <button class="key" onclick="pk('9')">9</button>
    <button class="key gold" onclick="cp()">&#x2715;</button>
    <button class="key" onclick="pk('0')">0</button>
    <button class="key gold" onclick="bk()">&#x232B;</button>
  </div>
  <div class="pin-msg" id="pmsg"></div>
</div>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-title">VAULT</div>
    <div class="topbar-right">
      <span class="sync-status" id="sync-status">&#9679; Synced</span>
      <button class="icon-btn" onclick="openSettings()" title="Settings">&#9881;</button>
      <button class="icon-btn" onclick="lockApp()" title="Lock">&#128274;</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="si">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search records..." oninput="doSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div class="folder-tabs" id="ftabs"></div>
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="rec-modal">
  <div class="modal">
    <div class="modal-title" id="rec-modal-title">New Record</div>
    <div class="notice">&#9729; Saved to Google Sheets &mdash; syncs across all devices</div>
    <div class="fg"><label class="fl">Title / Site Name</label><input class="fi" id="f-title" placeholder="e.g. Gmail, Netflix, HSBC" autocomplete="off" autocapitalize="words"></div>
    <div class="fg"><label class="fl">Record Type</label>
      <select class="fi" id="f-type"><option>Website</option><option>App</option><option>Email</option><option>Banking</option><option>Social Media</option><option>Work</option><option>Shopping</option><option>Other</option></select>
    </div>
    <div class="fg"><label class="fl">Username / Login</label><input class="fi" id="f-login" placeholder="username or email" autocomplete="off" autocapitalize="off"></div>
    <div class="fg"><label class="fl">Password</label>
      <input class="fi" id="f-pw" type="password" placeholder="password" autocomplete="new-password">
      <div style="display:flex;gap:8px;margin-top:6px">
        <button type="button" class="sbtn" onclick="togFormPw()" id="f-pw-eye">Show password</button>
        <button type="button" class="sbtn" onclick="cpFormPw()">Copy password</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Folder</label><select class="fi" id="f-folder"></select></div>
    <div class="fg"><label class="fl">Notes (optional)</label>
      <textarea class="fi" id="f-notes" placeholder="URL, account number, hint..." rows="3" style="resize:none;overflow:hidden;line-height:1.5" oninput="autoGrow(this)"></textarea>
    </div>
    <div class="mactions">
      <button class="bc" onclick="closeModal('rec-modal')">Cancel</button>
      <button class="bp" id="save-rec-btn" onclick="saveRec()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="fol-modal">
  <div class="modal">
    <div class="modal-title" id="fol-modal-title">New Folder</div>
    <div class="fg"><label class="fl">Folder Name</label><input class="fi" id="f-fname" placeholder="e.g. Personal, Work, Shopping" autocapitalize="words"></div>
    <div class="mactions">
      <button class="bc" onclick="closeModal('fol-modal')">Cancel</button>
      <button class="bp" onclick="saveFol()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="set-modal">
  <div class="modal">
    <div class="modal-title">Settings</div>
    <div class="ssect">
      <h3>Change PIN</h3>
      <div class="fg"><label class="fl">New PIN (4 digits)</label><input class="fi" id="s-p1" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN"></div>
      <div class="fg"><label class="fl">Confirm PIN</label><input class="fi" id="s-p2" type="password" inputmode="numeric" maxlength="4" placeholder="Repeat PIN"></div>
      <div id="s-msg" style="font-size:13px;color:var(--danger);min-height:18px;margin-bottom:8px"></div>
      <button class="bp" style="width:100%" onclick="changePin()">Change PIN</button>
    </div>
    <div class="ssect">
      <h3>Data</h3>
      <p style="font-size:13px;color:var(--text3);line-height:1.6">Your records are stored in Google Sheets and sync automatically across all your devices. No manual backup needed.</p>
    </div>
    <div class="ssect">
      <h3>Danger Zone</h3>
      <button class="stbtn danger-btn" onclick="wipeAll()">&#128465; Erase all data &amp; reset PIN</button>
    </div>
    <div class="mactions"><button class="bc" style="flex:1" onclick="closeModal('set-modal')">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxg5bbiRP6uFyRIvgZjPzYn6hN57St7KZQbwvoVyCsTTSiq7qbSkNqbLzrkojHjmQ_I/exec';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d) {
  var day = d.getDate();
  return (day < 10 ? '0' : '') + day + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function autoGrow(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

// ---- API calls ----
function api(params, cb) {
  var url = API + '?';
  var parts = [];
  for (var k in params) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  url += parts.join('&');
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onload = function() {
    try { cb(null, JSON.parse(xhr.responseText)); }
    catch(e) { cb('Parse error'); }
  };
  xhr.onerror = function() { cb('Network error'); };
  xhr.send();
}

function setSyncStatus(state) {
  var el = document.getElementById('sync-status');
  if (state === 'ok') { el.textContent = '\u25cf Synced'; el.className = 'sync-status ok'; }
  else if (state === 'syncing') { el.textContent = '\u25cf Syncing...'; el.className = 'sync-status'; }
  else { el.textContent = '\u25cf Offline'; el.className = 'sync-status err'; }
}

// ---- state ----
var S = { folders:[], records:[], af:'all' };
var cur = '', phase = 'new1', tmp = '';
var eRec = null, eFol = null;

// ---- PIN ----
function initPin() {
  cur = ''; tmp = ''; updDots();
  document.getElementById('pmsg').textContent = '';
  document.getElementById('psub').textContent = 'Connecting to your vault...';
  document.getElementById('pphase').textContent = '';
  api({action:'getPin'}, function(err, res) {
    if (err || res.error) {
      document.getElementById('psub').textContent = 'Could not connect. Check your internet connection.';
      document.getElementById('pmsg').textContent = err || res.error;
      return;
    }
    if (!res.pin) {
      phase = 'new1';
      document.getElementById('psub').textContent = 'Welcome! Choose a 4-digit PIN.';
      document.getElementById('pphase').textContent = 'Step 1 of 2 \u2014 Enter new PIN';
    } else {
      phase = 'login';
      document.getElementById('psub').textContent = 'Enter your PIN to unlock';
      document.getElementById('pphase').textContent = '';
    }
  });
}

function pk(k) {
  if (cur.length >= 4) return;
  cur += k; updDots();
  document.getElementById('pmsg').textContent = '';
  if (cur.length === 4) setTimeout(h4, 200);
}
function bk() { cur = cur.slice(0,-1); updDots(); }
function cp() { cur = ''; updDots(); }
function updDots() {
  var i;
  for (i=0;i<4;i++) document.getElementById('d'+i).className = 'pin-dot'+(i<cur.length?' filled':'');
}

function h4() {
  if (phase === 'new1') {
    tmp = cur; cur = ''; phase = 'new2'; updDots();
    document.getElementById('psub').textContent = 'Enter your PIN again to confirm';
    document.getElementById('pphase').textContent = 'Step 2 of 2 \u2014 Confirm PIN';
  } else if (phase === 'new2') {
    if (cur === tmp) {
      document.getElementById('pphase').textContent = 'Saving PIN...';
      api({action:'setPin', pin:cur}, function(err, res) {
        if (err) { document.getElementById('pmsg').textContent = 'Could not save PIN. Try again.'; cur=''; updDots(); return; }
        openApp();
      });
    } else {
      document.getElementById('pmsg').textContent = 'PINs did not match. Start again.';
      flashErr(); cur=''; tmp=''; phase='new1'; updDots();
      document.getElementById('psub').textContent = 'Choose a 4-digit PIN.';
      document.getElementById('pphase').textContent = 'Step 1 of 2 \u2014 Enter new PIN';
    }
  } else {
    api({action:'getPin'}, function(err, res) {
      if (err || res.error) { document.getElementById('pmsg').textContent = 'Connection error. Try again.'; cur=''; updDots(); return; }
      if (cur === String(res.pin)) {
        document.getElementById('pphase').textContent = 'Unlocking\u2026';
        openApp();
      } else {
        document.getElementById('pmsg').textContent = 'Incorrect PIN. Try again.';
        flashErr(); cur=''; updDots();
      }
    });
  }
}

function flashErr() {
  var i;
  for (i=0;i<4;i++) document.getElementById('d'+i).className='pin-dot error';
  setTimeout(function(){ var j; for(j=0;j<4;j++) document.getElementById('d'+j).className='pin-dot'; }, 700);
}

function openApp() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'flex';
  loadAll();
}

function lockApp() {
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('search-input').value = '';
  S = {folders:[], records:[], af:'all'};
  initPin();
}

// ---- load all data ----
function loadAll() {
  setSyncStatus('syncing');
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading your records...</div>';
  api({action:'getAll'}, function(err, res) {
    if (err || res.error) {
      setSyncStatus('err');
      document.getElementById('content').innerHTML = '<div class="loading">Could not load records.<br>Check your connection and try refreshing.</div>';
      return;
    }
    S.records = res.records || [];
    S.folders = res.folders || [];
    setSyncStatus('ok');
    renderTabs();
    renderContent();
  });
}

// ---- folders ----
function renderTabs() {
  var i, f, sorted, html;
  sorted = S.folders.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  html = '<div class="ftab'+(S.af==='all'?' active':'')+'" onclick="setFol(\'all\')">All</div>';
  for (i=0;i<sorted.length;i++) {
    f = sorted[i];
    html += '<div class="ftab'+(S.af===f.id?' active':'')+'" onclick="setFol(\''+f.id+'\')">'+esc(f.name)+'</div>';
  }
  html += '<div class="ftab-add" onclick="openAddFol()">&#43;</div>';
  document.getElementById('ftabs').innerHTML = html;
}
function setFol(id) { S.af=id; renderTabs(); renderContent(); }

function openAddFol() {
  eFol=null;
  document.getElementById('fol-modal-title').textContent='New Folder';
  document.getElementById('f-fname').value='';
  openModal('fol-modal');
}
function editFol(id) {
  var i, f=null;
  for (i=0;i<S.folders.length;i++) { if(S.folders[i].id===id){f=S.folders[i];break;} }
  if (!f) return;
  eFol=id;
  document.getElementById('fol-modal-title').textContent='Rename Folder';
  document.getElementById('f-fname').value=f.name;
  openModal('fol-modal');
}
function saveFol() {
  var i, found=false, name=document.getElementById('f-fname').value.trim();
  if (!name) return;
  var folder = {id: eFol?eFol:('f'+Date.now()), name:name};
  setSyncStatus('syncing');
  api({action:'saveFolder', folder:JSON.stringify(folder)}, function(err, res) {
    if (err) { toast('Could not save folder',true); setSyncStatus('err'); return; }
    if (eFol) {
      for (i=0;i<S.folders.length;i++) { if(S.folders[i].id===eFol){S.folders[i].name=name;found=true;break;} }
    }
    if (!found) { S.folders.push(folder); S.af=folder.id; }
    setSyncStatus('ok');
    renderTabs(); renderContent(); closeModal('fol-modal');
  });
}
function delFol(id) {
  var i, fb=null;
  if (!confirm('Delete folder? Records inside will move to first available folder.')) return;
  for (i=0;i<S.folders.length;i++) { if(S.folders[i].id!==id){fb=S.folders[i];break;} }
  setSyncStatus('syncing');
  api({action:'deleteFolder', id:id}, function(err) {
    if (err) { toast('Could not delete folder',true); setSyncStatus('err'); return; }
    for (i=0;i<S.records.length;i++) { if(S.records[i].folderId===id) S.records[i].folderId=fb?fb.id:''; }
    S.folders=S.folders.filter(function(f){return f.id!==id;});
    S.af='all'; setSyncStatus('ok'); renderTabs(); renderContent();
  });
}

// ---- records ----
function getVisible() {
  var i, out, q=document.getElementById('search-input').value.toLowerCase().trim();
  var r=S.records.slice();
  if (q) {
    out=[];
    for (i=0;i<r.length;i++) { if(r[i].title.toLowerCase().indexOf(q)>=0) out.push(r[i]); }
    out.sort(function(a,b){
      var ai=a.title.toLowerCase().indexOf(q)===0?0:1, bi=b.title.toLowerCase().indexOf(q)===0?0:1;
      return ai!==bi?ai-bi:a.title.localeCompare(b.title);
    });
    return out;
  }
  if (S.af!=='all') r=r.filter(function(x){return x.folderId===S.af;});
  return r.sort(function(a,b){return a.title.localeCompare(b.title);});
}
function doSearch() { renderContent(); }

function renderContent() {
  var i, fi, recs=getVisible(), q=document.getElementById('search-input').value.trim();
  var fname='All Records';
  if (S.af!=='all') { for(fi=0;fi<S.folders.length;fi++){if(S.folders[fi].id===S.af){fname=S.folders[fi].name;break;}} }
  var h='<div class="folder-header">';
  if (!q) {
    h+='<div class="folder-name">'+esc(fname)+'</div>';
    if (S.af!=='all') h+='<div class="folder-actions"><button class="sbtn" onclick="editFol(\''+S.af+'\')">Rename</button> <button class="sbtn dbtn" onclick="delFol(\''+S.af+'\')">Delete</button></div>';
  } else {
    h+='<div class="folder-name">Search results</div>';
  }
  h+='</div><button class="add-btn" onclick="openAddRec()">+ Add Record</button>';
  if (!recs.length) {
    h+='<div class="empty"><p>'+(q?'No records found':'No records yet')+'</p><span style="font-size:13px">'+(q?'Try different search terms':'Tap Add Record to get started')+'</span></div>';
  } else {
    for (i=0;i<recs.length;i++) h+=buildCard(recs[i]);
  }
  document.getElementById('content').innerHTML=h;
}

function buildCard(r) {
  var i, fn='';
  for (i=0;i<S.folders.length;i++){if(S.folders[i].id===r.folderId){fn=S.folders[i].name;break;}}
  var h='';
  h+='<div class="rcard" id="rc-'+r.id+'" onclick="togCard(\''+r.id+'\')">';
  h+='<div class="rtop"><div class="rtitle">'+esc(r.title)+'</div><span class="rbadge">'+esc(r.type)+'</span></div>';
  h+='<div class="rmeta">'+(fn?esc(fn)+' &middot; ':'')+r.created+'</div>';
  h+='<div class="rdetail" id="rd-'+r.id+'">';
  h+='<div class="rfield"><div class="rlabel">Login / Username</div><div class="rval">'+esc(r.login||'-')+'</div></div>';
  h+='<div class="rfield"><div class="rlabel">Password</div><div class="pw-row">';
  h+='<span class="pw-text" id="pw-'+r.id+'">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>';
  h+='<button class="sbtn" onclick="togPw(event,\''+r.id+'\')">Show</button>';
  h+='<button class="sbtn" onclick="cpPw(event,\''+r.id+'\')">Copy</button>';
  h+='</div></div>';
  if (r.notes) h+='<div class="rfield"><div class="rlabel">Notes</div><div class="rval">'+esc(r.notes)+'</div></div>';
  h+='<div class="rbtns"><button class="sbtn" onclick="editRec(event,\''+r.id+'\')">Edit</button> <button class="sbtn dbtn" onclick="delRec(event,\''+r.id+'\')">Delete</button></div>';
  h+='</div></div>';
  return h;
}

function togCard(id) {
  var d=document.getElementById('rd-'+id), c=document.getElementById('rc-'+id);
  if (d.style.display==='block'){d.style.display='none';c.className='rcard';}
  else{d.style.display='block';c.className='rcard open';}
}
function getRec(id){var i;for(i=0;i<S.records.length;i++){if(S.records[i].id===id)return S.records[i];}return null;}
function togPw(e,id){
  e.stopPropagation();
  var r=getRec(id);if(!r)return;
  var el=document.getElementById('pw-'+id);
  if(el.getAttribute('data-shown')==='1'){el.textContent='\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7';el.removeAttribute('data-shown');}
  else{el.textContent=r.password;el.setAttribute('data-shown','1');}
}
function cpPw(e,id){
  e.stopPropagation();
  var r=getRec(id);if(!r)return;
  if(navigator.clipboard){navigator.clipboard.writeText(r.password).then(function(){toast('Password copied!');}).catch(function(){fbCopy(r.password);});}
  else fbCopy(r.password);
}
function fbCopy(v){var t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('Password copied!');}
function togFormPw(){var inp=document.getElementById('f-pw'),btn=document.getElementById('f-pw-eye');if(inp.type==='password'){inp.type='text';btn.textContent='Hide password';}else{inp.type='password';btn.textContent='Show password';}}
function cpFormPw(){var v=document.getElementById('f-pw').value;if(!v){toast('No password to copy',true);return;}if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){toast('Password copied!');}).catch(function(){fbCopy(v);});}else fbCopy(v);}

function fillFolSel(sel){
  var i,sorted=S.folders.slice().sort(function(a,b){return a.name.localeCompare(b.name);}),h='';
  for(i=0;i<sorted.length;i++) h+='<option value="'+sorted[i].id+'"'+(sorted[i].id===sel?' selected':'')+'>'+esc(sorted[i].name)+'</option>';
  document.getElementById('f-folder').innerHTML=h;
}
function openAddRec(){
  eRec=null;
  document.getElementById('rec-modal-title').textContent='New Record';
  document.getElementById('f-title').value='';
  document.getElementById('f-login').value='';
  document.getElementById('f-pw').value='';
  document.getElementById('f-pw').type='password';
  document.getElementById('f-pw-eye').textContent='Show password';
  document.getElementById('f-notes').value='';
  document.getElementById('f-notes').style.height='auto';
  document.getElementById('f-type').value='Website';
  fillFolSel(S.af==='all'?(S.folders[0]?S.folders[0].id:''):S.af);
  openModal('rec-modal');
}
function editRec(e,id){
  e.stopPropagation();
  var r=getRec(id);if(!r)return;
  eRec=id;
  document.getElementById('rec-modal-title').textContent='Edit Record';
  document.getElementById('f-title').value=r.title;
  document.getElementById('f-type').value=r.type;
  document.getElementById('f-login').value=r.login||'';
  document.getElementById('f-pw').value=r.password||'';
  document.getElementById('f-pw').type='password';
  document.getElementById('f-pw-eye').textContent='Show password';
  document.getElementById('f-notes').value=r.notes||'';
  setTimeout(function(){autoGrow(document.getElementById('f-notes'));},50);
  fillFolSel(r.folderId);
  openModal('rec-modal');
}
function saveRec(){
  var i, title=document.getElementById('f-title').value.trim();
  if(!title)return;
  var ex=eRec?getRec(eRec):null;
  var rec={
    id:eRec?eRec:('r'+Date.now()),
    title:title,
    type:document.getElementById('f-type').value,
    login:document.getElementById('f-login').value.trim(),
    password:document.getElementById('f-pw').value,
    folderId:document.getElementById('f-folder').value,
    notes:document.getElementById('f-notes').value.trim(),
    created:ex?ex.created:fmtDate(new Date())
  };
  document.getElementById('save-rec-btn').textContent='Saving...';
  document.getElementById('save-rec-btn').disabled=true;
  setSyncStatus('syncing');
  api({action:'save', record:JSON.stringify(rec)}, function(err,res){
    document.getElementById('save-rec-btn').textContent='Save';
    document.getElementById('save-rec-btn').disabled=false;
    if(err||!res||res.error){toast('Could not save. Try again.',true);setSyncStatus('err');return;}
    if(eRec){for(i=0;i<S.records.length;i++){if(S.records[i].id===eRec){S.records[i]=rec;break;}}}
    else S.records.push(rec);
    setSyncStatus('ok');
    renderContent();closeModal('rec-modal');toast(eRec?'Record updated':'Record saved');
  });
}
function delRec(e,id){
  e.stopPropagation();
  if(!confirm('Delete this record? Cannot be undone.'))return;
  setSyncStatus('syncing');
  api({action:'delete',id:id},function(err){
    if(err){toast('Could not delete.',true);setSyncStatus('err');return;}
    S.records=S.records.filter(function(x){return x.id!==id;});
    setSyncStatus('ok');renderContent();toast('Deleted');
  });
}

// ---- settings ----
function openSettings(){document.getElementById('s-p1').value='';document.getElementById('s-p2').value='';document.getElementById('s-msg').textContent='';openModal('set-modal');}
function changePin(){
  var p1=document.getElementById('s-p1').value.trim(),p2=document.getElementById('s-p2').value.trim(),msg=document.getElementById('s-msg');
  if(!/^\d{4}$/.test(p1)){msg.textContent='PIN must be exactly 4 digits';return;}
  if(p1!==p2){msg.textContent='PINs do not match';return;}
  api({action:'setPin',pin:p1},function(err){
    if(err){msg.textContent='Could not save PIN.';return;}
    closeModal('set-modal');toast('PIN changed');setTimeout(lockApp,1400);
  });
}
function wipeAll(){
  if(!confirm('Delete ALL records, folders and PIN? Cannot be undone.'))return;
  if(!confirm('Are you absolutely sure?'))return;
  api({action:'setPin',pin:''},function(){});
  S={folders:[],records:[],af:'all'};
  lockApp();
}

// ---- modals ----
function openModal(id){document.getElementById(id).className='modal-bg open';}
function closeModal(id){document.getElementById(id).className='modal-bg';}
var i,mbs=document.querySelectorAll('.modal-bg');
for(i=0;i<mbs.length;i++){mbs[i].addEventListener('click',function(e){if(e.target===this)this.className='modal-bg';});}

// ---- toast ----
var _tt=null;
function toast(msg,isErr){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(isErr?' err':'');
  if(_tt)clearTimeout(_tt);
  _tt=setTimeout(function(){t.className='toast';},2400);
}

// ---- init ----
initPin();
</script>
</body>
</html>
